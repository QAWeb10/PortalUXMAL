function fechaDHL(){
const meses=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const d=new Date();
return String(d.getDate()).padStart(2,"0")+" "+meses[d.getMonth()]+" "+String(d.getFullYear()).slice(-2);
}

function esc(v){
return String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));
}

function abrirDB(){
return new Promise((resolve,reject)=>{
const r=indexedDB.open(DB_NAME,DB_VERSION);
r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
r.onsuccess=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
});
}

async function guardarLocal(data){
try{
const db=await abrirDB();
return new Promise((resolve,reject)=>{
const tx=db.transaction(STORE,"readwrite");
tx.objectStore(STORE).put(data,"jornada");
tx.oncomplete=()=>resolve();
tx.onerror=()=>reject(tx.error);
});
}catch(e){console.warn("No se pudo guardar borrador local",e)}
}

async function leerLocal(){
try{
const db=await abrirDB();
return new Promise((resolve,reject)=>{
const tx=db.transaction(STORE,"readonly");
const r=tx.objectStore(STORE).get("jornada");
r.onsuccess=()=>resolve(r.result||null);
r.onerror=()=>reject(r.error);
});
}catch(e){return null}
}

async function borrarLocal(){
try{
const db=await abrirDB();
return new Promise(resolve=>{
const tx=db.transaction(STORE,"readwrite");
tx.objectStore(STORE).delete("jornada");
tx.oncomplete=resolve;
});
}catch(e){}
}

<script>

async function comprimirImagen(file){
return new Promise((resolve,reject)=>{
if(!file||!file.type.startsWith("image/")){
reject(new Error("Archivo no válido"));
return;
}

const img=new Image();
const url=URL.createObjectURL(file);

img.onload=()=>{
URL.revokeObjectURL(url);

let w=img.naturalWidth;
let h=img.naturalHeight;

if(w>PHOTO_MAX||h>PHOTO_MAX){
const escala=Math.min(PHOTO_MAX/w,PHOTO_MAX/h);
w=Math.round(w*escala);
h=Math.round(h*escala);
}

const canvas=document.createElement("canvas");
canvas.width=w;
canvas.height=h;

const ctx=canvas.getContext("2d",{alpha:false});
ctx.fillStyle="#fff";
ctx.fillRect(0,0,w,h);
ctx.drawImage(img,0,0,w,h);

canvas.toBlob(blob=>{
if(!blob){
reject(new Error("No se pudo comprimir la imagen"));
return;
}
resolve(blob);
},"image/jpeg",PHOTO_QUALITY);
};

img.onerror=()=>{
URL.revokeObjectURL(url);
reject(new Error("No se pudo leer la fotografía"));
};

img.src=url;
});
}

async function blobToDataURL(blob){
return new Promise((resolve,reject)=>{
const r=new FileReader();
r.onload=()=>resolve(r.result);
r.onerror=()=>reject(r.error);
r.readAsDataURL(blob);
});
}

async function previewImage(event,imageId){
const archivo=event.target.files&&event.target.files[0];
if(!archivo)return;

try{
const blob=await comprimirImagen(archivo);
const data=await blobToDataURL(blob);

const img=document.getElementById(imageId);
if(!img)return;

img.src=data;
img.style.display="block";

const icon=img.previousElementSibling;
if(icon)icon.style.display="none";

const boton=document.getElementById(`btn-${imageId}`);
if(boton)boton.style.display="block";

await guardarJornadaLocal();
}catch(e){
console.error(e);
alert("No se pudo procesar la fotografía.");
event.target.value="";
}
}

function validarEmbarques(){
const tarjetas=document.querySelectorAll("[id^='embarque-']");
const errores=[];

if(!tarjetas.length){
errores.push("Debe existir al menos un embarque.");
return errores;
}

tarjetas.forEach((t,i)=>{
const n=i+1;

const cortina=t.querySelector(".cortina")?.value.trim()||"";
const unidad=t.querySelector(".unidad")?.value.trim()||"";
const destino=t.querySelector(".destino")?.value.trim()||"";

if(!cortina)errores.push(`Embarque ${n}: falta cortina`);
else if(cortina.length>3)errores.push(`Embarque ${n}: cortina inválida`);

if(!unidad)errores.push(`Embarque ${n}: falta unidad de envío`);
else if(unidad.length<8||unidad.length>10)
errores.push(`Embarque ${n}: unidad inválida`);

if(!destino)errores.push(`Embarque ${n}: falta destino`);

["inicio","medio","fin"].forEach(tipo=>{
const img=t.querySelector(`[id^='${tipo}-']`);
if(!img||!img.src||!img.src.startsWith("data:image"))
errores.push(`Embarque ${n}: falta fotografía ${tipo}`);
});
});

return errores;
}

function base64ToBlob(data){
const partes=data.split(",");
const mime=(partes[0].match(/:(.*?);/)||[])[1]||"image/jpeg";
const bin=atob(partes[1]);
const arr=new Uint8Array(bin.length);

for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);

return new Blob([arr],{type:mime});
}

async function dataURLToFile(data,name){
return new File([base64ToBlob(data)],name,{type:"image/jpeg"});
}

file=await dataURLToFile(data,nombre+".jpg");
}else{
file=data;
}

const comprimida=await comprimirImagen(file);

const nombreArchivo=
`${Date.now()}_${Math.random().toString(36).slice(2,8)}.jpg`;

const {error}=await supabaseClient.storage
.from("embarques-evidencia")
.upload(nombreArchivo,comprimida,{
contentType:"image/jpeg",
cacheControl:"31536000",
upsert:false
});

if(error)throw error;

const {data:urlData}=supabaseClient.storage
.from("embarques-evidencia")
.getPublicUrl(nombreArchivo);

return urlData.publicUrl;
}

async function obtenerFoto(t,tipo){
const img=t.querySelector(`[id^='${tipo}-']`);

if(!img||!img.src||!img.src.startsWith("data:image"))
return "";

return await subirImagen(img.src,`${tipo}.jpg`);
}

async function guardarEmbarqueIndividual(id){

async function urlToBase64(url){
return new Promise((resolve,reject)=>{
const img=new Image();

img.crossOrigin="anonymous";

img.onload=()=>{
try{
let w=img.naturalWidth;
let h=img.naturalHeight;

if(w>PHOTO_MAX||h>PHOTO_MAX){
const escala=Math.min(PHOTO_MAX/w,PHOTO_MAX/h);
w=Math.round(w*escala);
h=Math.round(h*escala);
}

const canvas=document.createElement("canvas");
canvas.width=w;
canvas.height=h;

const ctx=canvas.getContext("2d",{alpha:false});
ctx.drawImage(img,0,0,w,h);

resolve(canvas.toDataURL("image/jpeg",PHOTO_QUALITY));
}catch(e){
reject(e);
}
};

img.onerror=()=>reject(new Error("No se pudo cargar imagen"));

img.src=url;
});
}
